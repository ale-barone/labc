[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "LatticeABC"
version = "0.1"
authors = [
    { name = "Alessandro Barone" }
]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "joblib>=1.3",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest==7.4.0",
]
docs = [
    "sphinx==9.0.4",
    "sphinx-rtd-theme==3.1.0",
    "numpydoc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
